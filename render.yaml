# Render blueprint — https://render.com/docs/blueprint-spec
# Create a Blueprint instance from the repository and Render generates the
# secrets, builds the image and deploys it.
#
# The database is deliberately NOT provisioned here. Render's free Postgres is
# deleted 30 days after creation, which is a poor home for data you want to
# keep. Point DATABASE_URL at any Postgres you like — Neon's free tier does not
# expire — and set it in the dashboard, where it is not overwritten on sync.

services:
  - type: web
    name: consistency-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 8000
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # Set in the Render dashboard: the full Postgres connection string.
      # `postgres://` and `postgresql://` are both accepted — the app rewrites
      # them to the driver SQLAlchemy 2 expects.
      - key: DATABASE_URL
        sync: false
      # The SPA and the API share one origin here, so no cross-origin grant is needed.
      - key: CORS_ORIGINS
        value: ""
      - key: AI_PROVIDER
        value: mock
      # Set this in the Render dashboard and flip AI_PROVIDER to `anthropic`
      # to answer Coach and Reports with a model instead of the rule engine.
      - key: ANTHROPIC_API_KEY
        sync: false
